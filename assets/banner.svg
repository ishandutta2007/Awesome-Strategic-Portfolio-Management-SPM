<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="glowPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" fill-opacity="0.5" />
    </pattern>

    <style>
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -25px) scale(1.15); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        50% { transform: translate(-35px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1.1); }
      }

      @keyframes streamFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.35); opacity: 0.3; }
      }

      @keyframes radarSweep {
        0% { r: 5; opacity: 1; stroke-width: 2; }
        100% { r: 35; opacity: 0; stroke-width: 0.5; }
      }

      .animated-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite;
        transform-origin: center;
      }

      .animated-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite;
        transform-origin: center;
      }

      .flow-path {
        stroke-dasharray: 8 12;
        animation: streamFlow 4s linear infinite;
      }

      .flow-path-reverse {
        stroke-dasharray: 6 10;
        animation: streamFlow 5s linear infinite reverse;
      }

      .radar-ring {
        animation: radarSweep 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        transform-origin: center;
      }

      .radar-ring-delayed {
        animation: radarSweep 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.75s infinite;
        transform-origin: center;
      }

      .node-core {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: center;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }

      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- 2. Grid Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- 3. Dynamic Animated Ambient Background Orbs -->
  <g opacity="0.45">
    <circle cx="180" cy="110" r="170" fill="#4F46E5" filter="url(#glow)" class="animated-orb-1" />
    <circle cx="1020" cy="300" r="190" fill="#06B6D4" filter="url(#glow)" class="animated-orb-2" />
    <circle cx="600" cy="40" r="140" fill="#8B5CF6" filter="url(#glow)" class="animated-orb-1" />
    <circle cx="950" cy="90" r="120" fill="#3B82F6" filter="url(#glow)" class="animated-orb-2" />
  </g>

  <!-- 4. Dynamic Network Connection Lines & Nodes (Portfolio Strategy Graph) -->
  <g opacity="0.4">
    <!-- Connecting Strategy Paths -->
    <path d="M 80 340 Q 250 240 420 310 T 780 230 T 1120 290" fill="none" stroke="#4F46E5" stroke-width="2" class="flow-path" />
    <path d="M 120 80 Q 320 180 560 110 T 920 160 T 1140 100" fill="none" stroke="#06B6D4" stroke-width="1.5" class="flow-path-reverse" />
    <path d="M 280 360 L 420 310 L 560 110" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M 780 230 L 920 160 L 1050 280" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Strategic Nodes with Radar Rings -->
    <!-- Node A -->
    <g transform="translate(420, 310)">
      <circle cx="0" cy="0" r="5" stroke="#38BDF8" fill="none" class="radar-ring" />
      <circle cx="0" cy="0" r="5" stroke="#818CF8" fill="none" class="radar-ring-delayed" />
      <circle cx="0" cy="0" r="4" fill="#38BDF8" class="node-core" />
    </g>

    <!-- Node B -->
    <g transform="translate(780, 230)">
      <circle cx="0" cy="0" r="5" stroke="#818CF8" fill="none" class="radar-ring" />
      <circle cx="0" cy="0" r="5" stroke="#C084FC" fill="none" class="radar-ring-delayed" />
      <circle cx="0" cy="0" r="4" fill="#A855F7" class="node-core" />
    </g>

    <!-- Node C -->
    <g transform="translate(920, 160)">
      <circle cx="0" cy="0" r="5" stroke="#34D399" fill="none" class="radar-ring" />
      <circle cx="0" cy="0" r="4" fill="#10B981" class="node-core" />
    </g>
  </g>

  <!-- 5. Decorative Top & Bottom Borders -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- 6. FOREGROUND CONTENT (High Contrast, Never Obscured) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 72)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#10B981" />
    <text x="-98" y="5" fill="#94A3B8" class="badge-text" letter-spacing="1.5">ENTERPRISE SPM ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="148" text-anchor="middle" fill="#FFFFFF" class="title-text" font-size="44" filter="url(#slightGlow)">
    Awesome Strategic Portfolio Management
  </text>
  <text x="600" y="148" text-anchor="middle" fill="#FFFFFF" class="title-text" font-size="44">
    Awesome Strategic Portfolio Management
  </text>

  <!-- Title SPM Accent Tagline -->
  <text x="600" y="196" text-anchor="middle" fill="url(#accentGrad)" class="title-text" font-size="22" font-weight="700" letter-spacing="2">
    CONNECTING BUSINESS STRATEGY TO VALUE DELIVERY
  </text>

  <!-- Subtitle Description -->
  <text x="600" y="238" text-anchor="middle" fill="#CBD5E1" class="sub-text" font-size="16">
    Curated SaaS Platforms, Enterprise PPM Systems &amp; Self-Hosted Open-Source Frameworks
  </text>

  <!-- Feature Pillar Pills (Cards in Foreground) -->
  <g transform="translate(600, 315)">
    <!-- Pill 1: Strategic Alignment & OKRs -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#6366F1" />
      <text x="18" y="23" fill="#F8FAFC" class="badge-text" font-size="14">🎯 Strategic Alignment</text>
      <text x="18" y="41" fill="#94A3B8" class="sub-text" font-size="11">OKRs &amp; Executive Vision</text>
    </g>

    <!-- Pill 2: Portfolio Governance -->
    <g transform="translate(-225, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#8B5CF6" />
      <text x="18" y="23" fill="#F8FAFC" class="badge-text" font-size="14">📊 Portfolio Prioritization</text>
      <text x="18" y="41" fill="#94A3B8" class="sub-text" font-size="11">Scoring, Gates &amp; Scenarios</text>
    </g>

    <!-- Pill 3: Capacity & Financials -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#06B6D4" />
      <text x="18" y="23" fill="#F8FAFC" class="badge-text" font-size="14">⚖️ Capacity &amp; Financials</text>
      <text x="18" y="41" fill="#94A3B8" class="sub-text" font-size="11">Resource Leveling &amp; Budgets</text>
    </g>

    <!-- Pill 4: Sovereign Open Source -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#10B981" />
      <text x="18" y="23" fill="#F8FAFC" class="badge-text" font-size="14">🔓 Sovereign Governance</text>
      <text x="18" y="41" fill="#94A3B8" class="sub-text" font-size="11">Self-Hosted Open Source</text>
    </g>
  </g>

  <!-- Clean Bottom Accent Dot Navigation -->
  <g transform="translate(600, 392)">
    <circle cx="-30" cy="0" r="3" fill="#6366F1" />
    <circle cx="-10" cy="0" r="3" fill="#8B5CF6" />
    <circle cx="10" cy="0" r="3" fill="#06B6D4" />
    <circle cx="30" cy="0" r="3" fill="#10B981" />
  </g>
</svg>
